flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/muslim_scout_logo.png
  min_sdk_android: 21

  remove_alpha_ios: true
  background_color_ios: "#652390"

  adaptive_icon_background: "#652390"
  adaptive_icon_foreground: assets/branding/muslim_scout_logo.png
  adaptive_icon_foreground_inset: 18

  web:
    generate: true
    image_path: assets/branding/muslim_scout_logo.png
    background_color: "#652390"
    theme_color: "#652390"

  windows:
    generate: true
    image_path: assets/branding/muslim_scout_logo.png
    icon_size: 48

  macos:
    generate: false
