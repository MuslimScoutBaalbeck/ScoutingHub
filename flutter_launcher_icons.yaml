flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/launcher/production/wareed_launcher_icon.png
  min_sdk_android: 21

  remove_alpha_ios: true
  background_color_ios: "#0A0C18"

  adaptive_icon_background: "#0A0C18"
  adaptive_icon_foreground: assets/branding/launcher/base/wareed_launcher_foreground.png
  adaptive_icon_foreground_inset: 18
  adaptive_icon_monochrome: assets/branding/launcher/base/wareed_launcher_monochrome.png

  web:
    generate: true
    image_path: assets/branding/launcher/production/wareed_launcher_playstore.png
    background_color: "#0A0C18"
    theme_color: "#7C3AED"

  windows:
    generate: true
    image_path: assets/branding/launcher/production/wareed_launcher_icon.png
    icon_size: 48

  macos:
    generate: false